services:
  postgres:
    image: postgres:16-alpine
    container_name: vorzak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vorzak}
      POSTGRES_USER: ${POSTGRES_USER:-vorzak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vorzak_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vorzak} -d ${POSTGRES_DB:-vorzak}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
