spring:
  datasource:
    url: jdbc:h2:mem:vorzak_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

vorzak:
  storage:
    evidence-path: ./target/test-evidence
  worker:
    url: http://localhost:8001
  tinyfish:
    api-key: test-dummy-key
    search-url: https://api.search.tinyfish.ai
    fetch-url: https://api.fetch.tinyfish.ai
    agent-url: https://agent.tinyfish.ai
    max-steps: 10
    agent-enabled: false
